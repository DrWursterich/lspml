[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
# `warn` until the duplicate `syn` & `bitflags` are resolved
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = []

[bans.workspace-dependencies]
duplicates = "allow"
include-path-dependencies = false
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/DrWursterich/tree-sitter-spml"]
